<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fragrance Prices</title>
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fragrances">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{color-scheme:light dark;
  --bg:#f2f2f7;--card:#fff;--ink:#111114;--muted:#6e6e73;--faint:#aeaeb2;--line:#e5e5ea;--fill:#e9e9ee;
  --accent:#0b6e7f;--accent-soft:#e3f1f3;--drop:#c2410c;--drop-soft:#fdeee6;--good:#1f7a4d;--good-soft:#e5f4ec}
@media (prefers-color-scheme:dark){:root{
  --bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--muted:#98989f;--faint:#636366;--line:#2c2c2e;--fill:#2c2c2e;
  --accent:#5cc8d7;--accent-soft:#12343a;--drop:#ff8a5c;--drop-soft:#3a1d12;--good:#4cc38a;--good-soft:#11301f}}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overflow-x:clip}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) max(16px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}

/* header */
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:18px 0 4px}
h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.02em;margin:0}
.sub{color:var(--muted);font-size:14px;margin:4px 0 16px}
.offline{color:var(--drop)}

/* segmented control */
.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px;flex:none}
.seg button{border:0;background:none;border-radius:7px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted);min-height:32px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0000001f}

/* search + tabs */
.search{position:relative;margin:0 0 12px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint)}
.find{width:100%;font:17px inherit;font-family:inherit;border:0;border-radius:10px;background:var(--fill);color:var(--ink);min-height:40px;padding:0 12px 0 34px;-webkit-appearance:none}
.find::placeholder{color:var(--faint)}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 14px;padding:0 16px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;border-radius:999px;background:var(--card);color:var(--ink);padding:0 16px;min-height:36px;font-size:15px;font-weight:500;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.sortbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-4px 2px 10px;color:var(--muted);font-size:13px}
.sortbar label{display:flex;align-items:center;gap:6px}
.sortbar select{font:inherit;font-size:15px;font-weight:600;color:var(--accent);background:var(--card);border:0;border-radius:999px;min-height:36px;padding:0 30px 0 14px;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 17px) 16px,calc(100% - 12px) 16px;background-size:5px 5px;background-repeat:no-repeat;max-width:62vw}
.sortbar button.txt{border:0;background:none;color:var(--accent);font:inherit;font-size:15px;font-weight:600;min-height:36px;padding:0 4px;cursor:pointer}
.erow{background:var(--card);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.erow.drag{z-index:5;box-shadow:0 8px 24px #0003;border-radius:12px}
.erow .mv{flex:none;border:0;background:var(--fill);color:var(--ink);width:34px;height:34px;border-radius:9px;font-size:13px;cursor:pointer}
.erow .mv:disabled{opacity:.3}
.handle{flex:none;width:40px;height:44px;display:grid;place-items:center;color:var(--muted);touch-action:none;cursor:grab}
.wrap.home{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:8px;padding:6px max(16px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:.5px solid var(--line)}
.tabbar button{flex:0 1 170px;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:48px;font:inherit;font-size:11px;font-weight:600;cursor:pointer}
.tabbar button[aria-current=page]{color:var(--accent)}

/* grouped list */
.label{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:26px 16px 8px}
.group{background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;position:relative;min-height:60px}
.row+.row::before{content:"";position:absolute;top:0;right:0;left:58px;border-top:.5px solid var(--line)}
.group.plain .row+.row::before{left:16px}
a.row:active{background:var(--fill)}
.dot{display:inline-block;flex:none;width:30px;height:30px;border-radius:9px;position:relative;box-shadow:inset 0 0 0 .5px #0000001a}
.dot::after{content:"";position:absolute;left:7px;top:6px;width:4px;height:16px;border-radius:2px;background:#ffffff66}
.main{flex:1}
.t{font-weight:600;font-size:16px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s{color:var(--muted);font-size:13px;line-height:1.3;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.end{flex:none;text-align:right}
.p{font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.p.none{color:var(--faint);font-weight:400}
.chev{flex:none;color:var(--faint);margin-left:-4px}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:1px 6px;margin-top:3px;white-space:nowrap}
.tag.drop{background:var(--drop-soft);color:var(--drop)}
.tag.hit{background:var(--good-soft);color:var(--good)}
.tag.info{background:var(--fill);color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:15px}
.note{color:var(--muted);font-size:13px;line-height:1.45;margin:8px 16px 0}
.star-on{color:#e0a100}
details.how{margin-top:26px}
details.how summary{list-style:none;cursor:pointer;color:var(--accent);font-size:15px;padding:8px 16px}
details.how summary::-webkit-details-marker{display:none}
details.how .body{background:var(--card);border-radius:12px;padding:14px 16px;font-size:14px;color:var(--muted);line-height:1.5}
details.how p{margin:0 0 10px}

/* detail */
.nav{display:flex;align-items:center;justify-content:space-between;margin:4px -8px 0;min-height:44px}
.nav a,.nav button{display:inline-flex;align-items:center;gap:2px;color:var(--accent);font-size:17px;padding:8px;border:0;background:none;cursor:pointer;min-height:44px}
.hero{text-align:center;margin:8px 0 18px}
.hero .dot{display:block;width:56px;height:56px;border-radius:16px;margin:0 auto 12px}
.hero .dot::after{left:13px;top:11px;width:7px;height:30px;border-radius:4px}
.hero h1{font-size:28px}
.hero .brand{color:var(--muted);font-size:15px;margin-top:2px}
.big{font-size:44px;font-weight:700;letter-spacing:-.02em;margin-top:14px;font-variant-numeric:tabular-nums;line-height:1.05}
.big+.s{white-space:normal;font-size:14px;margin-top:4px}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:0 0 12px}
.sizes{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.sizes::-webkit-scrollbar{display:none}
.sizes button{flex:none;border:0;border-radius:999px;background:var(--card);padding:0 14px;min-height:34px;font-size:14px;font-weight:500;cursor:pointer}
.sizes button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.chart{background:var(--card);border-radius:12px;padding:12px 8px 6px;position:relative;height:220px}
.chart svg{display:block;width:100%;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:8px 16px 0;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.best{color:var(--good);font-size:12px;font-weight:600}
form.target .row{gap:10px}
form.target select,form.target input{font:inherit;font-size:16px;border:0;background:var(--fill);color:var(--ink);border-radius:8px;min-height:36px;padding:0 10px;-webkit-appearance:none}
form.target input{width:100px;text-align:right}
.btn{border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;font-size:16px;min-height:44px;padding:0 18px;cursor:pointer;width:100%}
.btn.link{background:none;color:var(--drop);width:auto;padding:0 4px;font-weight:500}
.tmsg{color:var(--good);font-size:13px;margin:8px 16px 0}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="fade" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".18"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs></svg>
<div id="app"><div class="wrap"><div class="hdr"><h1>Fragrances</h1></div><p class="sub">Loading prices…</p></div></div>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>v==null||!isFinite(v)?'—':'$'+Number(v).toFixed(2);
const okId=s=>typeof s==='string'&&/^[a-z0-9-]+$/i.test(s);
const okUrl=u=>typeof u==='string'&&u.startsWith('https://')?u:null;
const okHex=c=>typeof c==='string'&&/^#[0-9a-f]{6}$/i.test(c)?c:'#8e8e93';
const num=v=>typeof v==='number'&&isFinite(v)?v:null;
const tOf=d=>Date.parse(d+'T00:00:00');
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtD=d=>{const x=new Date(typeof d==='number'?d:tOf(d));return isNaN(x)?'':x.getDate()+' '+MON[x.getMonth()]};
const LINE=['#0b84a5','#e8590c','#7950f2','#d4a017','#d6336c','#2b8a3e','#868e96','#15aabf'];
const S={products:{},retailers:{},listings:{},meta:{},mode:'del',size:null,sizeFor:null,loaded:false,err:null,offline:false,tmsg:'',pending:false,series:[],tab:null,q:'',base:{}};
const ls$=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
S.mode=ls$('fpt-mode')==='list'?'list':'del';S.tab=ls$('fpt-tab');S.sec=ls$('fpt-sec')==='dupes'?'dupes':'frag';S.dtab=ls$('fpt-dtab')||'all';S.sort={frag:ls$('fpt-sort-frag')||'default',dupes:ls$('fpt-sort-dupes')||'default'};
let ORDER=[];try{ORDER=JSON.parse(ls$('fpt-order')||'[]')||[]}catch(e){ORDER=[]}
let SEEN={};try{SEEN=JSON.parse(ls$('fpt-seen')||'{}')||{}}catch(e){SEEN={}}
/* Watchlist and targets set on this phone sit on top of the shared data. */
let LOCAL={};try{LOCAL=JSON.parse(ls$('fpt-local')||'{}')||{}}catch(e){LOCAL={}}
function applyLocal(){const o={};for(const[id,p]of Object.entries(S.base)){const l=LOCAL[id];o[id]=l?Object.assign({},p,'fav'in l?{fav:l.fav}:{},'target'in l?{target:l.target}:{}):p}S.products=o}
let MAN=[];try{MAN=JSON.parse(ls$('fpt-manual')||'[]');if(!Array.isArray(MAN))MAN=[]}catch(e){MAN=[]}
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'store';
const today=()=>new Date().toLocaleDateString('en-CA');
/* Prices Ken types in himself: kept on this phone, merged in as extra store rows with their own history. */
function applyManual(){const R=Object.assign({},S.baseR),L=Object.assign({},S.baseL),byName={};for(const[id,r]of Object.entries(S.baseR||{}))byName[String(r.name).trim().toLowerCase()]=id;
  for(const m of MAN){if(!m||!okId(m.pid)||!(m.price>0)||!(m.ml>0)||!/^\d{4}-\d\d-\d\d$/.test(m.date||''))continue;const name=String(m.store||'').trim();if(!name)continue;
    let rid=byName[name.toLowerCase()];if(!rid){rid='my-'+slug(name);if(!R[rid])R[rid]={name,shipFee:null,freeOver:null,note:'Store you added'}}
    const lid='my-'+m.pid+'-'+rid+'-'+m.ml;const l=L[lid]||(L[lid]={pid:m.pid,rid,ml:m.ml,cur:'AUD',hist:[],mine:true,stock:'unknown',via:'manual'});
    l.hist=l.hist.filter(h=>h.d!==m.date).concat({d:m.date,a:m.price});if(okUrl(m.url))l.url=m.url;if(num(m.ship)!=null)l.ship=m.ship}
  for(const l of Object.values(L))if(l.mine){const h=hist(l),last=h[h.length-1];l.price=l.aud=last.a;l.checked=last.d}
  S.retailers=R;S.listings=L}
function saveManual(){ls$('fpt-manual',JSON.stringify(MAN));applyManual()}
function setLocal(id,patch){LOCAL[id]=Object.assign({},LOCAL[id],patch);ls$('fpt-local',JSON.stringify(LOCAL));applyLocal()}

/* ---------- pricing ---------- */
const rname=id=>S.retailers[id]?.name||id;
function fx(cur){if(!cur||cur==='AUD')return 1;return num(S.meta.fx&&S.meta.fx[cur])}
function aud(l){if(num(l.aud)!=null)return l.aud;const f=fx(l.cur),p=num(l.price);return p!=null&&f?Math.round(p*f*100)/100:null}
function ship(l,a){const r=S.retailers[l.rid]||{};if(num(l.ship)!=null)return l.ship;if(num(r.freeOver)!=null&&a>=r.freeOver)return 0;return num(r.shipFee)}
function deliv(l,a){if(a==null)return null;const s=ship(l,a);if(s==null)return{v:a,unk:true,k:a+9.95};let v=a+s;if(S.retailers[l.rid]?.gstExtra)v*=1.1;v=Math.round(v*100)/100;return{v,unk:false,k:v}}
const priceOf=(l,a)=>a==null?null:S.mode==='list'?{v:a,unk:false,k:a}:deliv(l,a);
function hist(l){return(Array.isArray(l.hist)?l.hist:[]).filter(x=>x&&typeof x.d==='string'&&num(x.a)!=null).slice().sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0)}
function listingsOf(pid){return Object.entries(S.listings).filter(([,l])=>l&&l.pid===pid&&num(l.ml)!=null).map(([id,l])=>Object.assign({id},l))}
function sizesOf(p,ls){return[...new Set([...(Array.isArray(p.sizes)?p.sizes.filter(n=>num(n)!=null):[]),...ls.map(l=>l.ml)])].sort((a,b)=>a-b)}
function mainMl(p,ls){if(num(p.mainMl)!=null)return p.mainMl;const c={};ls.forEach(l=>c[l.ml]=(c[l.ml]||0)+1);return Number(Object.keys(c).sort((a,b)=>c[b]-c[a])[0])||100}
function best(ls){let b=null;for(const l of ls){if(l.stock==='out')continue;const p=priceOf(l,aud(l));if(p&&(!b||p.k<b.p.k))b={l,p}}return b}
function bestValue(ls){let b=null;for(const l of ls){if(l.stock==='out')continue;const p=priceOf(l,aud(l));if(!p)continue;const per=p.v/l.ml*100,pk=p.k/l.ml*100;if(!b||pk<b.pk)b={l,p,per,pk}}return b}
function seriesOf(l){return hist(l).map(x=>({t:tOf(x.d),v:priceOf(l,x.a)?.v})).filter(p=>p.v!=null&&!isNaN(p.t))}
function bestSeries(ls){const hs=ls.map(l=>[l,hist(l)]);const ds=[...new Set(hs.flatMap(([,h])=>h.map(x=>x.d)))].sort();
  return ds.map(d=>{let m=null;for(const[l,h]of hs){let x=null;for(const y of h){if(y.d<=d)x=y;else break}if(!x)continue;const p=priceOf(l,x.a);if(p&&(m==null||p.v<m))m=p.v}return m==null?null:{t:tOf(d),v:m}}).filter(Boolean)}
function lowOf(l){const s=seriesOf(l);return s.length?Math.min(...s.map(p=>p.v)):null}
function drops(){const out=[],now=Date.now();for(const[,l]of Object.entries(S.listings)){if(!l||!S.products[l.pid])continue;const h=hist(l);if(h.length<2)continue;const a=h[h.length-2],b=h[h.length-1];if(b.a<a.a&&now-tOf(b.d)<15*864e5){const pa=priceOf(l,a.a),pb=priceOf(l,b.a);if(pa&&pb&&pb.v<pa.v)out.push({l,from:pa.v,to:pb.v,d:b.d})}}return out.sort((x,y)=>y.d<x.d?-1:1).slice(0,10)}
function targetHit(p,ls){const t=p.target;if(!t||num(t.price)==null||num(t.ml)==null)return null;const b=best(ls.filter(l=>l.ml===t.ml));return{t,b,hit:!!(b&&b.p.v<=t.price)}}



/* ---------- drawing ---------- */
const CHEV='<svg class="chev" width="8" height="14" viewBox="0 0 8 14" aria-hidden="true"><path d="M1 1l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const dot=c=>`<span class="dot" style="background:${okHex(c)}" aria-hidden="true"></span>`;
function drawChart(){const s=$('#chart');if(!s)return;const W=s.clientWidth,H=s.clientHeight;if(!W||!H)return;const ser=S.series,pts=ser.flatMap(x=>x.pts);
  if(!pts.length){s.innerHTML=`<text x="${W/2}" y="${H/2}" text-anchor="middle" fill="var(--muted)" font-size="14">No prices for this size yet</text>`;return}
  const L=40,R=12,T=10,B=22,ts=pts.map(p=>p.t),vs=pts.map(p=>p.v);const t0=Math.min(...ts),t1=Math.max(...ts);let v0=Math.min(...vs),v1=Math.max(...vs);const sp=Math.max(v1-v0,v1*.12,10);v0=Math.max(0,v0-sp*.25);v1+=sp*.25;
  const X=t=>t1===t0?L+(W-L-R)/2:L+(t-t0)/(t1-t0)*(W-L-R),Y=v=>T+(1-(v-v0)/(v1-v0))*(H-T-B);let g='';
  for(let i=0;i<=3;i++){const v=v0+(v1-v0)*i/3,y=Y(v).toFixed(1);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="${i?'2 3':''}"/><text x="${L-6}" y="${+y+4}" text-anchor="end" font-size="11" fill="var(--faint)">$${Math.round(v)}</text>`}
  g+=`<text x="${L}" y="${H-4}" font-size="11" fill="var(--faint)">${fmtD(t0)}</text>`;if(t1!==t0)g+=`<text x="${W-R}" y="${H-4}" text-anchor="end" font-size="11" fill="var(--faint)">${fmtD(t1)}</text>`;
  ser.forEach(x=>{const P=x.pts.map(p=>[X(p.t).toFixed(1),Y(p.v).toFixed(1)]);if(P.length>1)g+=`<polyline points="${P.map(q=>q.join(',')).join(' ')}" fill="none" stroke="${x.c}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;const q=P[P.length-1];g+=`<circle cx="${q[0]}" cy="${q[1]}" r="4.5" fill="${x.c}" stroke="var(--card)" stroke-width="2"/>`});
  s.innerHTML=g}
const ro=new ResizeObserver(()=>drawChart());

/* ---------- views ---------- */
function modeSeg(){return`<div class="seg" role="group" aria-label="Price shown"><button data-mode="del" aria-pressed="${S.mode==='del'}">Delivered</button><button data-mode="list" aria-pressed="${S.mode==='list'}">Listed</button></div>`}
function statusLine(){const m=S.meta;const d=m.lastRun?new Date(m.lastRun):null;const t=d&&!isNaN(d)?'Updated '+d.toLocaleString('en-AU',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}):'Checked every morning';const n=Object.values(S.products).filter(p=>!isDupe(p)).length,nd=Object.keys(S.products).length-n;return t+' · '+n+' fragrances'+(nd?' · '+nd+' dupes':'')}
function row(pid,p){const ls=listingsOf(pid),ml=mainMl(p,ls),main=ls.filter(l=>l.ml===ml),b=best(main),ser=bestSeries(main),tg=targetHit(p,ls);
  let tag='';if(tg&&tg.hit)tag=`<span class="tag hit">Target hit</span>`;
  else if(ser.length>1){const d=ser[ser.length-1].v-ser[ser.length-2].v;if(d<-.004)tag=`<span class="tag drop">▼ ${money(-d)}</span>`}

  <p class="tmsg" id="mmsg">${esc(S.mmsg||'')}</p>
  ${(()=>{const mine=MAN.filter(m=>m&&m.pid===pid).sort((a,b)=>a.date<b.date?1:-1);return mine.length?`<div class="label">Prices you added</div><div class="group plain">${mine.map(m=>`<div class="row"><div class="main"><div class="t">${esc(m.store)} · ${esc(m.ml)}ml</div><div class="s">${esc(fmtD(m.date))} ${esc(String(m.date).slice(0,4))}${num(m.ship)!=null?' · delivery '+money(m.ship):''}</div></div><div class="end"><div class="p">${money(m.price)}</div></div><button class="btn link" data-del="${esc(m.id)}" aria-label="Delete this price">Delete</button></div>`).join('')}</div>`:''})()}
  <div class="label">Price alert</div><form class="target group plain" id="tform"><div class="row"><div class="main"><div class="t">Size</div></div><select name="ml" aria-label="Size">${opts}</select></div><div class="row"><div class="main"><div class="t">At or under</div><div class="s">Delivered price</div></div><input name="price" type="number" inputmode="decimal" min="1" step="0.01" placeholder="$0.00" aria-label="Target price" value="${num(tg.price)!=null?tg.price:''}"></div><div class="row"><button class="btn" type="submit">Save target</button>${num(tg.price)!=null?'<button class="btn link" type="button" id="tclear">Clear</button>':''}</div></form>
  <p class="tmsg" id="tmsg">${esc(S.tmsg)}</p>
  <div class="label">Best price by size</div><div class="group plain">${perSize.map(x=>`<div class="row"><div class="main"><div class="t">${esc(x.ml)}ml</div><div class="s">${x.b?esc(rname(x.b.l.rid))+' · '+money(x.b.p.v/x.ml*100)+'/100ml':'Not found yet'}</div></div><div class="end"><div class="p${x.b?'':' none'}">${x.b?money(x.b.p.v)+(x.b.p.unk?' +':''):'—'}</div></div></div>`).join('')}</div></div>`}
function render(){const f=$('#tform'),mf=$('#mform'),fi=$('#find');if((f&&f.contains(document.activeElement))||(mf&&mf.contains(document.activeElement))||(fi&&fi===document.activeElement&&!location.hash.slice(1))){if(fi&&fi===document.activeElement){$('#grid').innerHTML=gridHtml()}else S.pending=true;return}S.pending=false;
  const id=decodeURIComponent(location.hash.slice(1));if(okId(id)&&S.products[id]&&S.seenId!==id){S.seenId=id;SEEN[id]=Date.now();ls$('fpt-seen',JSON.stringify(SEEN))}if(!okId(id))S.seenId=null;$('#app').innerHTML=okId(id)?detail(id):home();ro.disconnect();const fig=$('#fig');if(fig)ro.observe(fig)}

/* ---------- events ---------- */
document.addEventListener('click',e=>{const m=e.target.closest('[data-mode]');if(m){S.mode=m.dataset.mode==='list'?'list':'del';ls$('fpt-mode',S.mode);render();return}
  const sc=e.target.closest('[data-sec]');if(sc){if(S.sec===sc.dataset.sec){scrollTo(0,0);return}S.edit=false;S.sec=sc.dataset.sec==='dupes'?'dupes':'frag';ls$('fpt-sec',S.sec);S.q='';render();scrollTo(0,0);return}
  const t=e.target.closest('[data-tab]');if(t){if(S.sec==='dupes'){S.dtab=t.dataset.tab;ls$('fpt-dtab',S.dtab)}else{S.tab=t.dataset.tab;ls$('fpt-tab',S.tab)}render();return}
  if(e.target.closest('#fav')){const id=decodeURIComponent(location.hash.slice(1));if(S.products[id]){setLocal(id,{fav:!S.products[id].fav});render()}return}
  const z=e.target.closest('[data-size]');if(z){S.size=Number(z.dataset.size);render();return}
  const del=e.target.closest('[data-del]');if(del){MAN=MAN.filter(m=>String(m.id)!==del.dataset.del);saveManual();S.mmsg='Price deleted.';render();return}
  if(e.target.id==='tclear')saveTarget(null)});
document.addEventListener('submit',e=>{if(e.target.id!=='mform')return;e.preventDefault();const f=e.target,pid=decodeURIComponent(location.hash.slice(1)),msg=s=>{$('#mmsg').textContent=s};
  const store=f.store.value.trim().slice(0,60),ml=Math.round(Number(f.ml.value)),price=Math.round(Number(f.price.value)*100)/100,shipV=f.ship.value.trim(),ship=shipV===''?null:Math.round(Number(shipV)*100)/100,date=f.date.value,url=f.url.value.trim();
  if(!store)return msg('Enter the store name.');if(!(ml>0))return msg('Enter the bottle size in ml.');if(!(price>0))return msg('Enter a price above $0.');
  if(ship!=null&&!(ship>=0))return msg('Delivery should be $0 or more.');if(!/^\d{4}-\d\d-\d\d$/.test(date)||date>today())return msg('Pick a date that isn\'t in the future.');
  if(url&&!okUrl(url))return msg('Links need to start with https://');
  MAN.push({id:String(Date.now()),pid,store,ml,price,ship,date,url:url||null});saveManual();document.activeElement?.blur();S.mmsg=`Saved ${money(price)} at ${store} for ${ml}ml.`;if(ml!==S.size)S.size=ml;render()});
document.addEventListener('submit',e=>{if(e.target.id!=='tform')return;e.preventDefault();const ml=Number(e.target.ml.value),pr=Number(e.target.price.value);
  if(!(pr>0)){$('#tmsg').textContent='Enter a price above $0.';return}saveTarget({ml,price:Math.round(pr*100)/100})});
document.addEventListener('click',e=>{
  if(e.target.closest('#oedit')){S.edit=true;S.sort.frag='default';ls$('fpt-sort-frag','default');render();return}
  if(e.target.closest('#odone')){S.edit=false;render();return}
  if(e.target.closest('#oreset')){ORDER=[];ls$('fpt-order','[]');render();return}
  const mv=e.target.closest('[data-mv]');if(mv){const ids=[...document.querySelectorAll('#elist .erow')].map(r=>r.dataset.id);const id=mv.closest('.erow').dataset.id,i=ids.indexOf(id),k=i+Number(mv.dataset.mv);if(k<0||k>=ids.length)return;ids.splice(i,1);ids.splice(k,0,id);setOrder(ids);$('#grid').innerHTML=gridHtml();const b=document.querySelector(`#elist .erow[data-id="${CSS.escape(id)}"] [data-mv="${mv.dataset.mv}"]`);if(b&&!b.disabled)b.focus();return}
});
/* drag to reorder (touch and mouse) */
let DRAG=null;
document.addEventListener('pointerdown',e=>{const h=e.target.closest('.handle');if(!h)return;const r=h.closest('.erow');e.preventDefault();h.setPointerCapture(e.pointerId);DRAG={r,h,y:e.clientY,off:0};r.classList.add('drag')});
document.addEventListener('pointermove',e=>{if(!DRAG)return;e.preventDefault();const {r}=DRAG;DRAG.off=e.clientY-DRAG.y;r.style.transform=`translateY(${DRAG.off}px)`;
  const prev=r.previousElementSibling,next=r.nextElementSibling;
  if(next&&DRAG.off>next.offsetHeight/2){const h=next.offsetHeight;r.parentNode.insertBefore(next,r);DRAG.y+=h;DRAG.off-=h;r.style.transform=`translateY(${DRAG.off}px)`}
  else if(prev&&-DRAG.off>prev.offsetHeight/2){const h=prev.offsetHeight;r.parentNode.insertBefore(r,prev);DRAG.y-=h;DRAG.off+=h;r.style.transform=`translateY(${DRAG.off}px)`}
  const vh=innerHeight;if(e.clientY<80)scrollBy(0,-8);else if(e.clientY>vh-110)scrollBy(0,8)},{passive:false});
function endDrag(){if(!DRAG)return;const {r}=DRAG;r.style.transform='';r.classList.remove('drag');DRAG=null;setOrder([...document.querySelectorAll('#elist .erow')].map(x=>x.dataset.id));$('#grid').innerHTML=gridHtml()}
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
document.addEventListener('change',e=>{if(e.target.id==='sort'){S.sort[S.sec]=e.target.value;if(e.target.value!=='default')S.edit=false;ls$('fpt-sort-'+S.sec,e.target.value);$('#grid').innerHTML=gridHtml()}});
document.addEventListener('input',e=>{if(e.target.id==='find'){S.q=e.target.value;$('#grid').innerHTML=gridHtml()}});
document.addEventListener('focusout',()=>setTimeout(()=>{if(S.pending)render()},0));
function saveTarget(t){const id=decodeURIComponent(location.hash.slice(1));if(!okId(id)||!S.products[id])return;document.activeElement?.blur();
  setLocal(id,{target:t});S.tmsg=t?`Saved. You'll see "Target hit" when ${t.ml}ml is ${money(t.price)} or less delivered.`:'Target cleared.';render()}
addEventListener('hashchange',()=>{S.tmsg='';S.mmsg='';document.activeElement?.blur();render();scrollTo(0,0)});

/* ---------- data ---------- */
function take(d){if(!d||typeof d!=='object')return;S.base=d.products||{};S.baseR=d.retailers||{};S.baseL=d.listings||{};applyManual();S.meta=d.meta||{};applyLocal();S.loaded=true}
async function load(){try{const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const d=await r.json();take(d);S.offline=false;S.err=null;ls$('fpt-data',JSON.stringify(d))}
  catch(e){S.offline=true;if(!S.loaded){try{take(JSON.parse(ls$('fpt-data')||'null'))}catch(x){}if(!S.loaded)S.err='load'}}render()}
try{take(JSON.parse(ls$('fpt-data')||'null'))}catch(e){}
render();load();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')load()});
if('serviceWorker'in navigator){const had=!!navigator.serviceWorker.controller;let done=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!done){done=true;location.reload()}});
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{r.update();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')r.update()})}).catch(()=>{}))}
}
</script>
</body>
</html>
